<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iniciar sesión</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #2a1762, #4e73df);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Nunito", sans-serif;
    }
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 35px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 90%;
      max-width: 380px;
      text-align: center;
      box-sizing: border-box;
    }
    h2 { color: #2a1762; margin-bottom: 25px; }
    .input-group { position: relative; margin-bottom: 20px; }
    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #4e73df, #1cc88a);
      border: none;
      color: white;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .msg { color: red; margin-top: 10px; }
    .login-header {
      display: flex;
      align-items: center; /* Centra verticalmente */
      justify-content: center; /* Centra horizontalmente */
      gap: 15px; /* Espacio entre logo y título */
      margin-bottom: 25px;
    }

    .logo {
      width: 100px; /* Ajusta el tamaño del logo */
      height: auto;
    }

  </style>
</head>
<body>
  <div class="login-container">
    
    <div class="login-header">
      <img src="./img/logosinfondo.webp" alt="Logo de la empresa" class="logo" />
      <h2>Iniciar sesión</h2>
    </div>
  

    <form id="loginForm">
      <div class="input-group">
        <input type="text" id="username" placeholder="Nombre de usuario" required />
      </div>
      <div class="input-group">
        <input type="password" id="logPass" placeholder="Contraseña" required />
      </div>
      <button type="submit">Entrar</button>
    </form>
    <div class="msg" id="logMsg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAufk9exwZvg13Vq5FxkKfVxpLxhil0OYw",
      authDomain: "informe-saln.firebaseapp.com",
      projectId: "informe-saln",
      storageBucket: "informe-saln.firebasestorage.app",
      messagingSenderId: "988302920980",
      appId: "1:988302920980:web:ff1419142be203889c0601",
      measurementId: "G-DE6WHLGCQH"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const redirectAfterLogin = "ingreso.html";

    const loginForm = document.getElementById("loginForm");
    const logMsg = document.getElementById("logMsg");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      logMsg.textContent = "";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("logPass").value;

      try {
        // 1️⃣ Buscar correo asociado al nombre de usuario en Firestore
        const q = query(collection(db, "users"), where("username", "==", username));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          logMsg.textContent = "Usuario no encontrado.";
          return;
        }

        // 2️⃣ Obtener el correo del usuario
        const userData = querySnapshot.docs[0].data();
        const email = userData.email;

        // 3️⃣ Hacer login normal con el correo obtenido
        await signInWithEmailAndPassword(auth, email, password);

        window.location.href = redirectAfterLogin;
      } catch (error) {
        console.error("Error login:", error);
        logMsg.textContent = traducirError(error);
      }
    });

    function traducirError(error) {
      const code = error.code;
      switch (code) {
        case "auth/wrong-password": return "Contraseña incorrecta.";
        case "auth/user-not-found": return "Usuario no encontrado.";
        default: return "Error al iniciar sesión.";
      }
    }
  </script>
</body>
</html>
