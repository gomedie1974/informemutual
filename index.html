<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iniciar sesión</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      background: #f4f4f4;
    }
    h2 { text-align: center; }
    input {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background-color: #0056b3; }
    .msg { color: red; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h2>Iniciar sesión</h2>
  <form id="loginForm">
    <input type="email" id="logEmail" placeholder="Correo electrónico" required />
    <input type="password" id="logPass" placeholder="Contraseña" required />
    <button type="submit">Entrar</button>
  </form>
  <div class="msg" id="logMsg"></div>

  <script type="module">
    // --- IMPORTS Firebase SDK v9+ (modular) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";    

    // --- TU CONFIGURACIÓN DE FIREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyAufk9exwZvg13Vq5FxkKfVxpLxhil0OYw",
      authDomain: "informe-saln.firebaseapp.com",
      projectId: "informe-saln",
      storageBucket: "informe-saln.firebasestorage.app",
      messagingSenderId: "988302920980",
      appId: "1:988302920980:web:ff1419142be203889c0601",
      measurementId: "G-DE6WHLGCQH"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // URL donde redirigir tras login exitoso
    const redirectAfterLogin = 'ingreso.html';

    // Función de login
    const loginForm = document.getElementById('loginForm');
    const logMsg = document.getElementById('logMsg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      logMsg.textContent = '';
      const email = document.getElementById('logEmail').value.trim();
      const password = document.getElementById('logPass').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // Si el login es exitoso, redirige al index
        window.location.href = redirectAfterLogin;
      } catch (error) {
        console.error('Error login:', error);
        logMsg.textContent = traducirError(error);
      }
    });

    // Si el usuario ya está autenticado, redirige automáticamente
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = redirectAfterLogin;
      }
    });

    // Traducción básica de errores de Firebase
    function traducirError(error) {
      const code = error.code;
      switch (code) {
        case 'auth/invalid-email':
          return 'Correo electrónico inválido.';
        case 'auth/user-disabled':
          return 'Cuenta deshabilitada.';
        case 'auth/user-not-found':
          return 'Usuario no encontrado.';
        case 'auth/wrong-password':
          return 'Contraseña incorrecta.';
        default:
          return 'Error al iniciar sesión.';
      }
    }
  </script>
</body>
</html>
